# ─────────────────────────────────────────────────────────────
# Coding-Agent Harness — Model Configuration
# ─────────────────────────────────────────────────────────────
# This file is the SINGLE source of truth for which LLM the
# harness talks to.  To switch providers, change `model_provider`
# and update `model_name` / `api_key_env_var` accordingly.
# ─────────────────────────────────────────────────────────────

# Which provider backend to use.
# Supported values: "anthropic" | "google" | "openai"
model_provider: "openai"

# Model identifier sent to the provider API.
# Examples:
#   OpenAI:           "gpt-4o", "gpt-4o-mini", "gpt-4-turbo"
#   NVIDIA Nemotron:  "nvidia/nemotron-4-340b-instruct"
#   Anthropic:        "claude-sonnet-4-20250514", "claude-3-5-sonnet-20241022"
#   Google:           "gemini-1.5-flash", "gemini-1.5-pro", "gemini-2.0-flash"
model_name: "nvidia/nemotron-3-ultra-550b-a55b"

# Name of the environment variable that holds the API key.
# The evaluation environment standard is AI_API_KEY.
# If omitted or empty, falls back to provider-specific keys (NVIDIA_API_KEY, OPENAI_API_KEY, etc.)
api_key_env_var: "AI_API_KEY"

# Optional: override the API base URL (for proxies, Azure, vLLM, NVIDIA, etc.)
# Examples:
#   OpenAI default:   leave commented out
#   NVIDIA Nemotron:  "https://integrate.api.nvidia.com/v1"
base_url: "https://integrate.api.nvidia.com/v1"

# Default generation parameters (can be overridden per call)
temperature: 0.0
max_tokens: 4096

